[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
#: The distribution name, not the import name. `agent-ledger` is taken on PyPI
#: by an unrelated project, so the name that ships is `ai-agent-ledger-py`. The
#: import name (`agent_ledger`) and the console scripts (`al`, `agent-ledger`)
#: are unchanged: a rename here costs nobody a line of code, and `pip install`
#: is the only string that had to change.
name = "ai-agent-ledger-py"
version = "0.2.1"
description = "An append-only, signed ledger for AI agent delegations. ARD finds agents, A2A talks to them — this records who authorised the work, within what limits, and how it ended."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-ledger contributors" }]
keywords = [
  "a2a",
  "agent-delegation",
  "agent-discovery",
  "agent-handoff",
  "agent-ledger",
  "agent-registry",
  "ai-agents",
  "ard",
  "audit-trail",
  "capability-matching",
  "intent-routing",
  "mcp",
  "multi-agent",
  "provenance",
  "receipts",
  "task-routing",
  "transparency-log",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
#: Ed25519 signing. The standard library has no asymmetric signature primitive
#: in any version this project supports, so third-party-verifiable receipts need
#: a library. It is an extra rather than a dependency so that
#: `pip install agent-ledger` still pulls in nothing — the core ships
#: `HmacSigner`, which needs only `hmac`, and the import of `cryptography` is
#: lazy so that merely importing this package never requires it.
sign = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/yaoyuxiang-gnn/agent-ledger"
Repository = "https://github.com/yaoyuxiang-gnn/agent-ledger"
Issues = "https://github.com/yaoyuxiang-gnn/agent-ledger/issues"
Changelog = "https://github.com/yaoyuxiang-gnn/agent-ledger/blob/main/CHANGELOG.md"

[project.scripts]
al = "agent_ledger.cli:main"
agent-ledger = "agent_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ledger"]

[tool.hatch.build.targets.sdist]
# An explicit allowlist, not a denylist. .gitignore is the first line of
# defence, but it is easy to get subtly wrong — `.venv/` does not match
# `.venv-test/`, and that single missing pattern once produced a 16 MB sdist
# containing a whole virtualenv. This list is what makes such a mistake
# impossible rather than merely unlikely: anything not named here does not ship.
include = [
  "/src",
  "/tests",
  "/tools",
  "/docs",
  "/.github",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/README.zh-CN.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
